      responses:
        '201':
          $ref: '#/components/responses/LookupResponse'
  /countries/{country}:
    get:
      tags: [Lookups]
      summary: Show a country
      parameters:
        - $ref: '#/components/parameters/country'
      responses:
        '200':
          $ref: '#/components/responses/LookupResponse'
    put:
      tags: [Lookups]
      summary: Update a country
      parameters:
        - $ref: '#/components/parameters/country'
      requestBody:
        required: true
