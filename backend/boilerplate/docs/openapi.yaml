openapi: 3.0.3
info:
  title: Pharmacy Marketplace API
  version: 1.0.0
  description: Laravel JSON API for a pharmacy marketplace.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Public
  - name: Auth
  - name: ApprovalRequests
  - name: Notifications
  - name: Users
  - name: Lookups
  - name: Suppliers
  - name: Products
  - name: SupplierPosts
  - name: Pharmacies
  - name: Inventories
  - name: Commandes
  - name: Factures
  - name: Medications
  - name: MedicationActiveIngredients
paths:
  /:
    get:
      tags: [Public]
      summary: API health check
      responses:
        '200':
          description: API is working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API is working
  /files/{path}:
    get:
      tags: [Public]
      summary: Serve a public file asset
      parameters:
        - $ref: '#/components/parameters/path'
      responses:
        '200':
          description: File response
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a Sanctum token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      responses:
        '200':
          $ref: '#/components/responses/OkMessage'
  /auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
  /auth/avatar:
    post:
      tags: [Auth]
      summary: Upload or update user avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change current password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkMessage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /pharmacies/nearby:
    get:
      tags: [Public, Pharmacies]
      summary: Search nearby pharmacies beyond 5 km by city or coordinates
      security: []
      parameters:
        - in: query
          name: city
          required: false
          schema:
            type: string
          description: Resolve nearby search center using the average coordinates of pharmacies in this city.
        - in: query
          name: latitude
          required: false
          schema:
            type: number
        - in: query
          name: longitude
          required: false
          schema:
            type: number
        - in: query
          name: radius_km
          required: false
          schema:
            type: number
            default: 10
        - in: query
          name: medication_id
          required: false
          schema:
            type: integer
        - in: query
          name: medication_name
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/PaginatedPharmacyCollection'
  /pharmacies:
    get:
      tags: [Public, Pharmacies]
      summary: List public pharmacies
      security: []
      responses:
        '200':
          $ref: '#/components/responses/PaginatedPharmacyCollection'
    post:
      tags: [Pharmacies]
      summary: Create a pharmacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacyRequest'
      responses:
        '201':
          $ref: '#/components/responses/PharmacyResponse'
  /pharmacies/{pharmacy}:
    get:
      tags: [Public, Pharmacies]
      summary: Show a public pharmacy
      security: []
      parameters:
        - $ref: '#/components/parameters/pharmacy'
      responses:
        '200':
          $ref: '#/components/responses/PharmacyResponse'
    put:
      tags: [Pharmacies]
      summary: Update a pharmacy
      parameters:
        - $ref: '#/components/parameters/pharmacy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacyRequest'
      responses:
        '200':
          $ref: '#/components/responses/PharmacyResponse'
    patch:
      tags: [Pharmacies]
      summary: Update a pharmacy
      parameters:
        - $ref: '#/components/parameters/pharmacy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PharmacyRequest'
      responses:
        '200':
          $ref: '#/components/responses/PharmacyResponse'
    delete:
      tags: [Pharmacies]
      summary: Delete a pharmacy
      parameters:
        - $ref: '#/components/parameters/pharmacy'
      responses:
        '204':
          description: No Content
  /medications:
    get:
      tags: [Medications]
      summary: List medications visible to the authenticated user
      responses:
        '200':
          $ref: '#/components/responses/PaginatedMedicationCollection'
    post:
      tags: [Medications]
      summary: Create a medication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationRequest'
      responses:
        '201':
          $ref: '#/components/responses/MedicationResponse'
  /medications/{medication}:
    get:
      tags: [Medications]
      summary: Show a medication if owned by the authenticated user or admin
      parameters:
        - $ref: '#/components/parameters/medication'
      responses:
        '200':
          $ref: '#/components/responses/MedicationResponse'
    put:
      tags: [Medications]
      summary: Update a medication
      parameters:
        - $ref: '#/components/parameters/medication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationRequest'
      responses:
        '200':
          $ref: '#/components/responses/MedicationResponse'
    patch:
      tags: [Medications]
      summary: Update a medication
      parameters:
        - $ref: '#/components/parameters/medication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationRequest'
      responses:
        '200':
          $ref: '#/components/responses/MedicationResponse'
    delete:
      tags: [Medications]
      summary: Delete a medication
      parameters:
        - $ref: '#/components/parameters/medication'
      responses:
        '204':
          description: No Content
  /medications/{medication}/active-ingredients:
    get:
      tags: [MedicationActiveIngredients]
      summary: List a medication's active ingredients
      parameters:
        - $ref: '#/components/parameters/medication'
      responses:
        '200':
          $ref: '#/components/responses/MedicationActiveIngredientCollection'
    post:
      tags: [MedicationActiveIngredients]
      summary: Attach an active ingredient to a medication
      parameters:
        - $ref: '#/components/parameters/medication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationActiveIngredientRequest'
      responses:
        '201':
          $ref: '#/components/responses/MedicationActiveIngredientResponse'
  /medications/{medication}/active-ingredients/{active_ingredient}:
    get:
      tags: [MedicationActiveIngredients]
      summary: Show a medication active ingredient link
      parameters:
        - $ref: '#/components/parameters/medication'
        - $ref: '#/components/parameters/active_ingredient'
      responses:
        '200':
          $ref: '#/components/responses/MedicationActiveIngredientResponse'
    put:
      tags: [MedicationActiveIngredients]
      summary: Update a medication active ingredient link
      parameters:
        - $ref: '#/components/parameters/medication'
        - $ref: '#/components/parameters/active_ingredient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationActiveIngredientRequest'
      responses:
        '200':
          $ref: '#/components/responses/MedicationActiveIngredientResponse'
    patch:
      tags: [MedicationActiveIngredients]
      summary: Update a medication active ingredient link
      parameters:
        - $ref: '#/components/parameters/medication'
        - $ref: '#/components/parameters/active_ingredient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationActiveIngredientRequest'
      responses:
        '200':
          $ref: '#/components/responses/MedicationActiveIngredientResponse'
    delete:
      tags: [MedicationActiveIngredients]
      summary: Detach an active ingredient from a medication
      parameters:
        - $ref: '#/components/parameters/medication'
        - $ref: '#/components/parameters/active_ingredient'
      responses:
        '204':
          description: No Content
  /approval-requests:
    get:
      tags: [ApprovalRequests]
      summary: List approval requests
      responses:
        '200':
          $ref: '#/components/responses/PaginatedApprovalRequestCollection'
    post:
      tags: [ApprovalRequests]
      summary: Create an approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequestRequest'
      responses:
        '201':
          $ref: '#/components/responses/ApprovalRequestResponse'
  /approval-requests/{approval_request}:
    get:
      tags: [ApprovalRequests]
      summary: Show an approval request
      parameters:
        - $ref: '#/components/parameters/approval_request'
      responses:
        '200':
          $ref: '#/components/responses/ApprovalRequestResponse'
    put:
      tags: [ApprovalRequests]
      summary: Update a pending approval request
      parameters:
        - $ref: '#/components/parameters/approval_request'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequestRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApprovalRequestResponse'
    patch:
      tags: [ApprovalRequests]
      summary: Update a pending approval request
      parameters:
        - $ref: '#/components/parameters/approval_request'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequestRequest'
      responses:
        '200':
          $ref: '#/components/responses/ApprovalRequestResponse'
    delete:
      tags: [ApprovalRequests]
      summary: Delete an approval request
      parameters:
        - $ref: '#/components/parameters/approval_request'
      responses:
        '204':
          description: No Content
  /approval-requests/{approval_request}/status:
    patch:
      tags: [ApprovalRequests]
      summary: Accept or reject an approval request
      parameters:
        - $ref: '#/components/parameters/approval_request'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected, pending]
                review_notes:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/ApprovalRequestResponse'
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      responses:
        '200':
          $ref: '#/components/responses/PaginatedNotificationCollection'
  /notifications/{notification}:
    get:
      tags: [Notifications]
      summary: Show a notification
      parameters:
        - $ref: '#/components/parameters/notification'
      responses:
        '200':
          $ref: '#/components/responses/NotificationResponse'
    delete:
      tags: [Notifications]
      summary: Delete a notification
      parameters:
        - $ref: '#/components/parameters/notification'
      responses:
        '204':
