      summary: Mark notification as read
      parameters:
        - $ref: '#/components/parameters/notification'
      responses:
        '200':
          $ref: '#/components/responses/NotificationResponse'
  /users:
    get:
      tags: [Users]
      summary: List all users with optional role and text filters
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: role
          required: false
          schema:
            type: string
        - in: query
          name: roles[]
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          $ref: '#/components/responses/PaginatedUserCollection'
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
  /users/{user}:
    get:
      tags: [Users]
      summary: Show a user
      parameters:
        - $ref: '#/components/parameters/user'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
    put:
      tags: [Users]
      summary: Update a user
      parameters:
        - $ref: '#/components/parameters/user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
    patch:
      tags: [Users]
      summary: Update a user
      parameters:
        - $ref: '#/components/parameters/user'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
    delete:
      tags: [Users]
      summary: Delete a user
      parameters:
        - $ref: '#/components/parameters/user'
      responses:
        '204':
          description: No Content
  /laboratories:
    get:
      tags: [Lookups]
      summary: List laboratories owned by the current pharmacy admin
      responses:
        '200':
          $ref: '#/components/responses/PaginatedLookupCollection'
    post:
      tags: [Lookups]
      summary: Create a laboratory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaboratoryRequest'
      responses:
